name: ci
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - name: tests + coverage floor
        run: make cover
      - run: go build -o /tmp/bin .
      - name: smoke
        run: |
          /tmp/bin --version
          /tmp/bin --help >/dev/null
          /tmp/bin completion zsh >/dev/null

  gofmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then echo "::error::gofmt needed on:"; echo "$diff"; exit 1; fi
      - name: no em/en-dashes
        run: |
          hits=$(grep -rlP '[\x{2014}\x{2013}]' --include='*.go' --include='*.md' --include='*.yml' . || true)
          if [ -n "$hits" ]; then echo "::error::em/en-dashes found:"; echo "$hits"; exit 1; fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make lint
      - name: docs generate reproducibly
        run: make docs-check

  # Heavier scans stay off PRs: main pushes and the weekly schedule only.
  vuln:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make vuln

  gosec:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make sec

  secrets:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Build gitleaks from source via the Go proxy rather than the GitHub
      # release CDN, so a releases.githubusercontent.com hiccup can't fail CI.
      - name: gitleaks
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 detect --no-banner --redact --source .
